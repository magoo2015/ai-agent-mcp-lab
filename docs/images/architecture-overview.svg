  <text x="56" y="760" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">- Nginx is the sole public entry (Open WebUI at /, Grafana at /grafana/, AI Gateway at /gateway/).</text>
  <text x="56" y="780" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">- Prometheus scrapes Node Exporter, cAdvisor, and AI Gateway on the internal Docker network (not exposed publicly).</text>
  <text x="56" y="800" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">- MCP investigation path uses stdio transport; tools map alerts to MITRE ATT&amp;CK, SIEM queries, and investigation output.</text>
  <text x="56" y="820" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">- OpenAI provider is optional; default local inference is Ollama.</text>

