server {
    listen 80;
    server_name _;

    # Reverse proxy to AI Gateway (internal Docker network).
    # /metrics is NOT proxied — Prometheus scrapes ai-gateway:8000 internally.
    location /gateway/ {
        client_max_body_size 64k;

        proxy_pass http://ai-gateway:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Forward gateway auth header (required for POST /chat)
        proxy_set_header X-API-Key $http_x_api_key;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Reverse proxy to Open WebUI (internal Docker network)
    location / {
        proxy_pass http://open-webui:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Open WebUI uses WebSockets for streaming chat)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Long timeouts for AI chat responses (streaming can take minutes)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
