name: ai-security-platform

services:
  ollama:
    profiles: ["ai"]
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - open-webui:/app/backend/data

  ai-gateway:
    profiles: ["ai"]
    build:
      context: ./ai-gateway
    container_name: ai-gateway
    restart: unless-stopped
    # Internal only — reachable via Docker network (Nginx, Prometheus).
    # Do not publish host port 8000; Nginx is the sole public entry point.
    expose:
      - "8000"
    env_file:
      - path: .env
        required: false
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - DEFAULT_PROVIDER=${DEFAULT_PROVIDER:-ollama}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-tinyllama}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1-mini}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GATEWAY_API_KEY=${GATEWAY_API_KEY:-}
      - MAX_PROMPT_CHARS=${MAX_PROMPT_CHARS:-12000}
      - MAX_REQUEST_BYTES=${MAX_REQUEST_BYTES:-65536}
    depends_on:
      - ollama

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - open-webui

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    # Internal only — reachable via Docker network (Nginx).
    # Do not publish host port 3001; Nginx is the sole public entry point at /grafana/.
    expose:
      - "3000"
    environment:
      # Subpath hosting behind Nginx (override GRAFANA_ROOT_URL for TLS domain later)
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost/grafana/}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # Admin credentials — password required; only applied on first DB init (see docs/grafana.md)
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in platform/.env}
      # Harden auth: no anonymous browse, no self-signup (normal login remains enabled)
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana:/var/lib/grafana
    # Conservative limits for 2 vCPU / 4 GB VPS (observed ~126 MiB steady-state)
    mem_limit: 384m
    cpus: "0.50"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  promptfoo:
    profiles: ["eval"]
    image: ghcr.io/promptfoo/promptfoo:latest
    working_dir: /config
    entrypoint: ["promptfoo"]
    volumes:
      - ./promptfoo:/config
      - ./prompts:/prompts:ro
    mem_limit: 512m
    cpus: "0.50"

  mcp-server:
    profiles: ["mcp"]
    build:
      context: ./mcp-server
    working_dir: /app
    # Stdio MCP transport — no published ports. Use:
    #   docker compose --profile mcp run --rm -i mcp-server python mcp_server.py
    stdin_open: true
    tty: false

volumes:
  ollama:
    external: true
    name: ai-security-platform_ollama
  open-webui:
    external: true
    name: ai-security-platform_open-webui
  prometheus:
  grafana:
