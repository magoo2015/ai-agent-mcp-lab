# description: "AI Security Engineering Platform - Prompt Library Evaluation"
#
# Default suite (VPS-safe): 4 prompt templates × 1 SSH scenario = 4 evaluations.
# Additional SOC scenarios (Defender, Proofpoint, AWS IAM) are documented in
# docs/promptfoo.md as future work — they are not active tests here.

prompts:
  - file:///prompts/alert_summary.md
  - file:///prompts/mitre_mapping.md
  - file:///prompts/detection_recommendation.md
  - file:///prompts/executive_summary.md

providers:
  - id: http://ai-gateway:8000/chat
    config:
      method: POST
      headers:
        Content-Type: application/json
      body:
        model: tinyllama
        prompt: "{{prompt}}"
      transformResponse: "json.response"

evaluateOptions:
  maxConcurrency: 1

# Shared quality bar for every SOC template output.
defaultTest:
  assert:
    - type: not-contains
      value: "I cannot"
    - type: not-contains
      value: "I'm unable"
    - type: not-contains
      value: "as an AI"
    - type: javascript
      value: "output.length > 50"

# Active tests: SSH failed-login only (4 evals).
# Vars front-load observables and expected_focus so tinyllama has clear context.
tests:
  - description: alert_summary — SSH failed-login triage content
    prompts:
      - /prompts/alert_summary.md
    vars: &ssh_failed_login_vars
      alert_json: |
        {
          "source_ip": "192.168.1.50",
          "destination_host": "ubuntu-agent",
          "event_type": "ssh_failed_login",
          "username": "root",
          "failure_count": 15,
          "time_window": "10 minutes",
          "severity": "medium"
        }
      alert_data: |
        {
          "source_ip": "192.168.1.50",
          "destination_host": "ubuntu-agent",
          "event_type": "ssh_failed_login",
          "username": "root",
          "failure_count": 15,
          "time_window": "10 minutes",
          "severity": "medium"
        }
      investigation_context: >
        SSH authentication failure alert. Source IP 192.168.1.50 attempted
        SSH login as root against host ubuntu-agent. Count: 15 failed
        authentication attempts in 10 minutes. Treat as possible SSH brute force.
      activity_description: >
        SSH authentication failures: source IP 192.168.1.50 targeted host
        ubuntu-agent as user root. Observed 15 failed SSH logins in 10 minutes.
        Activity is consistent with SSH brute-force credential access (MITRE T1110).
      investigation_findings: >
        Investigation findings for SSH failed login: source 192.168.1.50,
        destination host ubuntu-agent, username root, 15 failed SSH authentication
        attempts in 10 minutes, medium severity. Recommend a detection rule with
        a failed-login threshold for SSH brute-force activity.
      expected_focus: >
        Focus on SSH authentication failures and brute-force indicators.
        Include observables from the alert: source IP 192.168.1.50, host
        ubuntu-agent, user root, and 15 failed logins in 10 minutes.
        Do not repeat the prompt template. Produce the requested SOC output only.
      alert_type: ssh_failed_login
      platform_context: Linux SSH
      existing_mitre_hints: T1110 Brute Force
      mitre_techniques: T1110
      investigation_package: |
        {
          "summary": "SSH authentication failures against ubuntu-agent — possible brute force",
          "event_type": "ssh_failed_login",
          "source_ip": "192.168.1.50",
          "destination_host": "ubuntu-agent",
          "username": "root",
          "failure_count": 15,
          "time_window": "10 minutes",
          "severity": "medium",
          "business_risk": "Unauthorized access risk to Linux host via SSH",
          "status": "under_investigation"
        }
      business_context: "Linux management host ubuntu-agent may be exposed to unauthorized SSH access."
    assert:
      # SSH / auth / failure language (not template echo alone)
      - type: icontains
        value: "ssh"
      - type: icontains-any
        value:
          - "authentication"
          - "auth"
          - "failed"
          - "failure"
      # At least one concrete observable from the alert
      - type: icontains-any
        value:
          - "192.168.1.50"
          - "root"
          - "ubuntu-agent"

  - description: mitre_mapping — ATT&CK technique framing
    prompts:
      - /prompts/mitre_mapping.md
    vars: *ssh_failed_login_vars
    assert:
      - type: icontains-any
        value:
          - "T1110"
          - "Brute Force"
          - "brute-force"
          - "brute force"
          - "technique"
      - type: contains-any
        value:
          - "MITRE"
          - "ATT&CK"

  - description: detection_recommendation — detection engineering content
    prompts:
      - /prompts/detection_recommendation.md
    vars: *ssh_failed_login_vars
    assert:
      # Detection logic language (paired with scenario terms below — not "rule" alone)
      - type: icontains-any
        value:
          - "detection"
          - "rule"
      - type: icontains-any
        value:
          - "threshold"
          - "failed"
          - "brute"
          - "ssh"
          - "login"

  - description: executive_summary — leadership-facing narrative
    prompts:
      - /prompts/executive_summary.md
    vars: *ssh_failed_login_vars
    assert:
      - type: icontains-any
        value:
          - "summary"
          - "risk"
      - type: icontains-any
        value:
          - "business"
          - "impact"
          - "executive"
