# description: "AI Security Engineering Platform - Prompt Library Evaluation"

prompts:
  - file:///prompts/alert_summary.md
  - file:///prompts/mitre_mapping.md
  - file:///prompts/detection_recommendation.md
  - file:///prompts/executive_summary.md

providers:
  - id: http://ai-gateway:8000/chat
    config:
      method: POST
      headers:
        Content-Type: application/json
      body:
        model: tinyllama
        prompt: "{{prompt}}"
      transformResponse: "json.response"

evaluateOptions:
  maxConcurrency: 1

# Shared quality bar for every SOC template output.
defaultTest:
  assert:
    - type: not-contains
      value: "I cannot"
    - type: not-contains
      value: "I'm unable"
    - type: not-contains
      value: "as an AI"
    - type: javascript
      value: "output.length > 50"

# Shared SSH failed-login scenario; prompt-specific assertions check SOC-relevant content.
tests:
  - description: alert_summary — SSH failed-login triage content
    prompts:
      - /prompts/alert_summary.md
    vars: &ssh_failed_login_vars
      alert_data: |
        {
          "source_ip": "192.168.1.50",
          "destination_host": "ubuntu-agent",
          "event_type": "ssh_failed_login",
          "username": "root",
          "failure_count": 15,
          "time_window": "10 minutes",
          "severity": "medium"
        }
      investigation_context: "Repeated SSH authentication failures against a Linux host."
      activity_description: "Repeated SSH authentication failures from 192.168.1.50 against ubuntu-agent targeting root, 15 failures in 10 minutes."
      investigation_findings: "SSH brute-force style activity: source 192.168.1.50, host ubuntu-agent, user root, 15 failed logins in 10 minutes, medium severity."
      investigation_package: |
        {
          "summary": "Repeated SSH authentication failures against ubuntu-agent",
          "source_ip": "192.168.1.50",
          "destination_host": "ubuntu-agent",
          "username": "root",
          "failure_count": 15,
          "time_window": "10 minutes",
          "severity": "medium",
          "status": "under_investigation"
        }
    assert:
      # Prefer grounded observables; tinyllama often omits IP/user but still
      # describes the SSH auth-failure event from investigation_context.
      - type: icontains
        value: "ssh"
      - type: icontains-any
        value:
          - "192.168.1.50"
          - "root"
          - "ubuntu-agent"
          - "authentication"
          - "failed"
          - "failure"

  - description: mitre_mapping — ATT&CK technique framing
    prompts:
      - /prompts/mitre_mapping.md
    vars: *ssh_failed_login_vars
    assert:
      # Prefer T1110 / Brute Force; tinyllama often names ATT&CK framing
      # ("technique") without emitting a technique ID.
      - type: icontains-any
        value:
          - "T1110"
          - "Brute Force"
          - "brute-force"
          - "brute force"
          - "technique"
      - type: contains-any
        value:
          - "MITRE"
          - "ATT&CK"

  - description: detection_recommendation — detection engineering content
    prompts:
      - /prompts/detection_recommendation.md
    vars: *ssh_failed_login_vars
    assert:
      - type: icontains-any
        value:
          - "detection"
          - "rule"
      - type: icontains-any
        value:
          - "threshold"
          - "failed"

  - description: executive_summary — leadership-facing narrative
    prompts:
      - /prompts/executive_summary.md
    vars: *ssh_failed_login_vars
    assert:
      - type: icontains-any
        value:
          - "summary"
          - "risk"
      - type: icontains-any
        value:
          - "business"
          - "impact"
          - "executive"
